<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Climax · Cinefied</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/core.css?v=0.2.3">
<style>
  /* Climax: one phone, passed around. A hidden fuse burns; whoever holds the phone at the blast loses. */
  :root{--c:var(--accent)}
  [hidden]{display:none!important}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .gs{display:none;position:fixed;inset:0;flex-direction:column;
      padding:calc(10px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
  .gs.on{display:flex}
  #s-home.on,#s-boom.on{animation:fwd .42s cubic-bezier(.2,.7,.2,1) both}
  #s-home .wrap{flex:1;min-height:0;display:flex;flex-direction:column;max-width:460px;width:100%;margin:0 auto}
  #startBtn{background:var(--c);box-shadow:0 10px 26px color-mix(in srgb,var(--c) 35%,transparent)}

  /* the fuse: a plain white screen, red rising from the bottom */
  #s-play{background:#fff;color:#14141c;align-items:center;justify-content:center;text-align:center;overflow:hidden;gap:14px}
  .fill{position:absolute;inset:0;background:var(--accent);transform-origin:bottom;transform:scaleY(0)}
  #s-play > :not(.fill):not(.stop){position:relative;transition:color .6s}
  #s-play.inv{color:#fff}
  .lbl{font-size:11px;letter-spacing:3px;opacity:.6}
  #cat{font-family:var(--display);font-weight:400;font-size:clamp(44px,min(13vw,14vh),96px);letter-spacing:2px;line-height:1;max-width:900px;text-wrap:balance;will-change:transform}
  .stop{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;
        border:1.5px solid currentColor;background:none;color:inherit;opacity:.35;display:grid;place-items:center;cursor:pointer;z-index:2}
  .stop svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

  /* the blast */
  #s-boom{background:var(--accent);color:#fff;align-items:center;justify-content:center;text-align:center;overflow:hidden}
  .ring{position:absolute;left:50%;top:42%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.75);opacity:0;pointer-events:none}
  #s-boom.on .ring{animation:ring 1.1s cubic-bezier(.1,.7,.3,1) both}
  #s-boom.on .ring.r2{animation-delay:.12s} #s-boom.on .ring.r3{animation-delay:.26s}
  @keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(7);opacity:0}}
  .boom{font-family:var(--display);font-weight:400;font-size:clamp(90px,min(30vw,34vmin),200px);white-space:nowrap;line-height:.9;letter-spacing:4px;position:relative}
  #s-boom.on .boom{animation:blast .55s cubic-bezier(.2,1.4,.4,1) both, shake .4s .1s linear}
  @keyframes blast{from{transform:scale(.2);opacity:0}}
  @keyframes shake{20%{translate:-6px 2px}40%{translate:5px -3px}60%{translate:-4px 1px}80%{translate:3px 2px}}
  #s-boom p{font-size:12.5px;opacity:.9;margin-top:8px;position:relative}
  #s-boom .acts{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-width:460px;margin:0 auto}
  #againBtn{background:#fff;color:#14141c;box-shadow:0 10px 26px rgba(0,0,0,.18)}
  #s-boom .btn.outline{border-color:rgba(255,255,255,.55);color:#fff;background:rgba(255,255,255,.1)}
  #s-boom::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 42%,rgba(255,255,255,.18),transparent 70%)}
  @media (orientation:landscape) and (max-height:500px){#s-boom .acts{flex-direction:row}#s-boom .acts .btn{flex:1}.ring{top:36%}}
</style>
</head>
<body>
<div id="game">
  <!-- 1. ENTRY -->
  <section class="gs on" id="s-home">
    <div class="bar">
      <button class="icon-btn" type="button" id="homeBtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="chipbtn" type="button" data-rules>How to play</button>
    </div>
    <div class="wrap">
      <div class="hero">
        <div class="glyph" aria-hidden="true">X</div>
        <div class="kind"><i></i>Pass one phone</div>
        <h1>CLIMAX</h1>
        <p>Name a movie that fits and pass the phone. A hidden fuse is burning. Don't be holding it at the blast.</p>
        <div class="facts"><span class="fact">1 phone</span><span class="fact">Any number</span><span class="fact">15–40 s fuse</span></div>
      </div>
      <button class="btn" type="button" id="startBtn">START</button>
    </div>
  </section>

  <!-- 2. THE FUSE -->
  <section class="gs" id="s-play">
    <div class="fill" id="fill"></div>
    <button class="stop" type="button" id="stopBtn" aria-label="Stop"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="lbl">NAME MOVIES FROM</div>
    <div id="cat"></div>
    <div class="lbl">No repeats. Keep it moving!</div>
  </section>

  <!-- 3. THE BLAST -->
  <section class="gs" id="s-boom">
    <span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span>
    <div class="boom">BOOM!</div>
    <p>Whoever is holding the phone lost</p>
    <div class="acts">
      <button class="btn" type="button" id="againBtn">NEXT ROUND</button>
      <button class="btn outline" type="button" id="quitBtn">STOP</button>
    </div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet ht-sheet" id="rulesSheet" aria-label="How to play"><div class="grab"></div><div id="howto"></div></section>

<script src="core/howto.js?v=0.2.0"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  // ═════════════ CATEGORIES (edit here) ═════════════
  const CATS = [
    'Mahesh Babu movies', 'Prabhas movies', 'Allu Arjun movies', 'N. T. Rama Rao Jr. movies',
    'Ram Charan movies', 'Pawan Kalyan movies', 'Chiranjeevi movies', 'Balakrishna movies',
    'Nani movies', 'Vijay Deverakonda movies', 'Nagarjuna movies', 'Venkatesh movies',
    'S. S. Rajamouli movies', 'Trivikram Srinivas movies', 'Sukumar movies',
    'Samantha movies', 'Anushka Shetty movies', 'Pooja Hegde movies',
    'Movies with music by Devi Sri Prasad', 'Movies with music by Thaman',
    'Telugu movies with a one-word title', 'Telugu movies that are sequels or have a part 2'
  ];
  // fuse length range in seconds (add ?fuse=3 to the address to test with a 3 second fuse)
  const FQ = parseFloat(new URLSearchParams(location.search).get('fuse'));
  const FUSE_MIN = FQ || 15, FUSE_MAX = FQ || 40;

  // ── theme: follows the phone unless the player chose one in Profile ──
  const sysDark = matchMedia('(prefers-color-scheme: dark)');
  function theme() {
    let pref = 'system'; try { pref = localStorage.getItem('cf_theme') || 'system'; } catch (e) {}
    const t = pref === 'system' ? (sysDark.matches ? 'dark' : 'light') : pref;
    document.documentElement.dataset.theme = t;
    const on = id => $(id).classList.contains('on');
    document.querySelector('meta[name=theme-color]').content = on('s-boom') ? '#ff3f3f' : on('s-play') ? '#ffffff' : t === 'light' ? '#f4f4f8' : '#0a0a0f';
  }
  theme(); sysDark.addEventListener('change', theme);

  // ── sound (made on the phone, no files) + buzz ──
  let AC = null;
  function unlock() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
  function tone(freq, dur, type, vol, when) {
    if (!AC) return; const t = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  }
  const beep = p => tone(700 + 500 * p, .09, 'square', .14);
  function boomSound() {
    if (!AC) return; const t = AC.currentTime, n = AC.sampleRate * 1.1, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(1800, t); f.frequency.exponentialRampToValueAtTime(120, t + 1);
    g.gain.value = .9; s.buffer = buf; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
    tone(70, .8, 'sine', .5);
  }
  const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // ── keep the screen awake while the fuse burns ──
  let wake = null;
  async function grab() { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
  function drop() { try { wake && wake.release(); } catch (e) {} wake = null; }

  // ── the game ──
  let usedCats = []; try { usedCats = JSON.parse(localStorage.getItem('cf_climax_used') || '[]').filter(c => CATS.includes(c)); } catch (e) {}
  let fuse = 0, elapsed = 0, last = 0, nextBeep = 0, running = false, loopT = null, beepStart = 0, beepInt = 900, raf = 0;
  function show(id) { document.querySelectorAll('#game .gs').forEach(s => s.classList.toggle('on', s.id === id)); theme(); }
  function fitCat() {
    const el = $('cat'); el.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while ((el.scrollWidth > el.clientWidth + 1 || el.offsetHeight > innerHeight * .5) && fs > 24) { fs -= 3; el.style.fontSize = fs + 'px'; }
  }
  function start() {
    unlock(); grab();
    let pool = CATS.filter(c => !usedCats.includes(c)); if (!pool.length) { usedCats = []; pool = CATS.slice(); }
    const cat = pool[Math.floor(Math.random() * pool.length)]; usedCats.push(cat);
    try { localStorage.setItem('cf_climax_used', JSON.stringify(usedCats)); } catch (e) {}
    $('cat').textContent = cat;
    fuse = (FUSE_MIN + Math.random() * (FUSE_MAX - FUSE_MIN)) * 1000;
    elapsed = 0; nextBeep = 0; running = true; last = performance.now();
    beepStart = 0; beepInt = 900; cancelAnimationFrame(raf);
    $('fill').style.transform = 'scaleY(0)'; $('s-play').classList.remove('inv'); show('s-play'); fitCat(); zoom(); loop();
  }
  function loop() {
    clearTimeout(loopT); if (!running) return;
    const t = performance.now(); elapsed += t - last; last = t;
    const p = Math.min(1, elapsed / fuse);
    if (elapsed >= fuse) return explode();
    if (elapsed >= nextBeep) {
      beep(p);
      beepStart = elapsed; beepInt = 900 - 760 * Math.pow(p, 1.4); nextBeep = elapsed + beepInt;
      if (p > .75) vib(15);
    }
    $('fill').style.transform = 'scaleY(' + p + ')'; $('s-play').classList.toggle('inv', p > .5);
    loopT = setTimeout(loop, 40);
  }
  // the category swells on every beep and eases back before the next one, so the zoom matches the beep rate
  function zoom() {
    if (!running) return;
    const e = elapsed + (performance.now() - last), ph = Math.min(1, Math.max(0, (e - beepStart) / beepInt));
    $('cat').style.transform = 'scale(' + (1 + 0.12 * (0.5 + 0.5 * Math.cos(2 * Math.PI * ph))).toFixed(4) + ')';
    raf = requestAnimationFrame(zoom);
  }
  function explode() {
    running = false; clearTimeout(loopT); cancelAnimationFrame(raf); $('cat').style.transform = ''; $('fill').style.transform = 'scaleY(1)';
    boomSound(); vib([200, 80, 300]); show('s-boom');
  }
  function stop() { running = false; clearTimeout(loopT); cancelAnimationFrame(raf); drop(); show('s-home'); }
  // the fuse keeps burning in the background only while the page is open; if the phone sleeps, it picks up from where it was
  document.addEventListener('visibilitychange', () => { if (!document.hidden && running) { last = performance.now(); grab(); } });
  addEventListener('resize', () => { if (running) fitCat(); });

  // ── how to play: the animated steps (drawn by core/howto.js) ──
  const HOWTO = {
    steps: [
      { d: 2900, t: 'Press START. A category appears on the phone.' },
      { d: 5200, t: 'Name a movie that fits, then pass the phone to the next person. No repeats.' },
      { d: 5200, t: 'A hidden fuse is burning. The screen turns red and the beeps get faster.' },
      { d: 3400, t: 'Whoever is holding the phone at the blast is out.' }
    ],
    build(svg, K) {
      const { el, op, cl, pr, ease, back, lerp, wrap, fitLines, pass, Phone, Player, Chip, Label, Pill, Ripple, COLORS } = K;
      const P = [[160, 44], [262, 124], [160, 204], [58, 124]], C = [160, 124];
      const CH = [[160, 13], [262, 158], [160, 236], [58, 158]];
      const near = i => { const p = P[i % 4]; return [lerp(p[0], C[0], .6), lerp(p[1], C[1], .6)]; };
      const names = ['Pokiri', 'Okkadu', 'Athadu', 'Dookudu', 'Khaleja', 'Murari', 'Srimanthudu', 'Businessman', 'Arjun', 'Spyder', 'Nijam', 'Takkari Donga', 'Maharshi'];
      const flash = el('rect', { width: 320, height: 250, fill: 'var(--accent)', opacity: 0 }, svg);
      const ringsG = el('g', {}, svg), rings = [0, 1, 2].map(() => Ripple(ringsG, '#fff', 3));
      const pl = el('g', {}, svg), players = P.map((p, i) => Player(pl, p[0], p[1], 'RSBA'[i], COLORS[i]));
      const waves = el('g', { opacity: 0 }, svg);
      ['M-22 -8Q-27 0 -22 8', 'M-28 -13Q-35 0 -28 13', 'M22 -8Q27 0 22 8', 'M28 -13Q35 0 28 13'].forEach(d => el('path', { d, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-linecap': 'round' }, waves));
      const ph = Phone(svg);
      const pill = el('g', {}, ph.cnt);
      el('rect', { x: -9, y: -3.4, width: 18, height: 6.8, rx: 3.4, fill: 'var(--accent)' }, pill);
      el('text', { class: 'd', 'text-anchor': 'middle', y: 1.6, 'font-size': 4.6, fill: '#fff', 'letter-spacing': .3 }, pill, 'START');
      const cat = el('g', { opacity: 0 }, ph.cnt);
      el('text', { class: 'm', 'text-anchor': 'middle', y: -12, 'font-size': 1.9, fill: '#8a8aa6', 'letter-spacing': .3 }, cat, 'NAME MOVIES FROM');
      const lines = wrap('Mahesh Babu movies', 9).map(s => el('text', { class: 'd', 'text-anchor': 'middle', fill: '#14141c' }, cat, s.toUpperCase()));
      const chip = Chip(svg), tap = Ripple(svg);
      const boom = el('g', { opacity: 0 }, svg);
      el('text', { class: 'd', 'text-anchor': 'middle', y: 24, 'font-size': 64, fill: '#fff', 'letter-spacing': 3 }, boom, 'BOOM!');
      const beeps = []; for (let t = 0; t < 5200;) { beeps.push(t); t += 640 - 480 * Math.pow(t / 5200, 1.15); }

      return (s, u) => {
        // reset
        op(flash, 0); rings.forEach(r => r.set(0, 0, 0)); op(waves, 0); op(boom, 0); chip.hide(); tap.set(0, 0, 0);
        players.forEach(p => p.set());
        let x = C[0], y = C[1], sc = 1.2, rot = 0, red = 0;
        op(pill, 0); op(cat, 0);
        if (s === 0) {
          players.forEach(p => p.set({ o: .22 }));
          sc = 2.4 + .6 * back(pr(u, 0, 550));
          const pressed = pr(u, 700, 160) - pr(u, 860, 160);
          op(pill, 1 - pr(u, 950, 220));
          pill.setAttribute('transform', `scale(${(1 - .12 * pressed).toFixed(3)})`);
          tap.set(C[0], C[1], pr(u, 760, 650), 34);
          const k = pr(u, 1050, 420);
          op(cat, k); cat.setAttribute('transform', `scale(${(.82 + .18 * back(k)).toFixed(3)})`);
          const fs = fitLines(lines, 8, 20.5), lh = fs * .92, top = -(lines.length - 1) * lh / 2 + fs * .34;
          lines.forEach((t, i) => t.setAttribute('y', (top + i * lh).toFixed(2)));
        } else if (s === 1) {
          const r = pass(u, 1300, 600, 0, near), k = ease(pr(u, 0, 550));
          x = lerp(C[0], r.x, k); y = lerp(C[1], r.y, k); sc = lerp(3, 1.2, k);
          op(cat, 1 - k * 1.6);
          rot = Math.sin(Math.PI * r.m) * 14;
          red = .2 * u / 5200;
          if (r.h >= 0 && u > 350) {
            players[r.h].set({ ring: 1 });
            chip.set(names[r.n % names.length], CH[r.h][0], CH[r.h][1], back(pr(r.r, 0, 260)));
          }
        } else if (s === 2) {
          const r = pass(u, 650, 260, 4, near), p = u / 5200;
          let tb = 0; for (const b of beeps) if (b <= u) tb = b;
          const pulse = Math.exp(-(u - tb) / 110);
          x = r.x; y = r.y; rot = Math.sin(Math.PI * r.m) * 10;
          sc = 1.2 * (1 + .13 * pulse); red = .2 + .8 * Math.pow(p, 1.15);
          op(waves, pulse * (.35 + .65 * p));
          waves.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(1 + .25 * (1 - pulse)).toFixed(3)})`);
          if (r.h >= 0) {
            players[r.h].set({ ring: 1, ringC: 'var(--accent)' });
            chip.set(names[r.n % names.length], CH[r.h][0], CH[r.h][1], back(pr(r.r, 0, 180)));
          }
        } else {
          const [nx, ny] = near(0); x = nx; y = ny; red = 1; sc = 1.2;
          op(flash, u < 110 ? u / 110 : .94 - .04 * pr(u, 110, 600));
          rings.forEach((r, i) => r.set(nx, ny, pr(u, 40 + i * 140, 950), 150));
          const k = pr(u, 60, 480), sh = u < 520 ? Math.sin(u / 18) * 5 * (1 - u / 520) : 0;
          op(boom, k * 1.5);
          boom.setAttribute('transform', `translate(${(160 + sh).toFixed(1)} ${(160 + sh * .4).toFixed(1)}) scale(${(.3 + .7 * back(k)).toFixed(3)})`);
          const out = pr(u, 650, 300);
          players[0].set({ ring: 1, ringC: '#fff', out });
          if (out > 0) chip.set('OUT', CH[0][0], CH[0][1], back(out));
          sc = 1.2 * (1 + .25 * Math.exp(-u / 160));
        }
        ph.at(x, y, sc, rot); ph.level(red);
      };
    }
  };

  const HT = CinefiedHowTo.create($('howto'), HOWTO);
  const openSheet = () => { $('rulesSheet').classList.add('open'); $('scrim').classList.add('open'); HT.play(); };
  const closeSheet = () => { HT.stop(); $('rulesSheet').classList.remove('open'); $('scrim').classList.remove('open'); };
  // every time the game is opened, the how-to-play plays first
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { if ($('s-home').classList.contains('on')) openSheet(); }, 450));
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('#startBtn') || t.closest('#againBtn')) return start();
    if (t.closest('#stopBtn') || t.closest('#quitBtn')) return stop();
    if (t.closest('#homeBtn')) return void history.back();
    if (t.closest('[data-rules]')) return openSheet();
    if (t.closest('#scrim') || t.closest('[data-close]')) return closeSheet();
  });
})();
</script>
</body>
</html>
