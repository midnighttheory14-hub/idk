<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Clue Pool · Cinefied</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/core.css?v=0.2.3">
<style>
  :root{--ta:var(--accent);--tb:var(--blue);--t:var(--ta);--o:var(--tb)}
  [hidden]{display:none!important}
  #game{display:none}
  #game.on{display:block}
  #game .gs{display:none;height:100vh;height:var(--app-h,100dvh);overflow:hidden;flex-direction:column;max-width:460px;margin:0 auto;position:relative;
      padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
  #game .gs.on{display:flex}
  #game .gs.in{animation:fwd .42s cubic-bezier(.2,.7,.2,1) both}
  .teamB{--t:var(--tb);--o:var(--ta)}

  .l-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1;min-width:0}
  .l-mid b{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:2.5px;white-space:nowrap}
  .l-mid small{font-size:10px;color:var(--t);white-space:nowrap;letter-spacing:1px}
  .clock{width:40px;height:40px;flex:none;position:relative;display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}
  .clock svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .clock circle{fill:none;stroke-width:3}
  .clock .bg{stroke:var(--border)} .clock .fg{stroke:var(--t);stroke-linecap:round;stroke-dasharray:113}

  /* the two teams' tokens */
  .tokbar{display:flex;gap:8px;margin:clamp(6px,1.4dvh,12px) 0 clamp(8px,1.6dvh,14px)}
  .tok{flex:1;border-radius:14px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:5px;min-width:0}
  .tok.me{border-color:color-mix(in srgb,var(--t) 55%,var(--border));background:color-mix(in srgb,var(--t) 8%,var(--surface))}
  .tok .nm{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
  .tok .nm b{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:1.5px;color:var(--k)}
  .dots{display:flex;gap:4px}
  .dots i{flex:1;height:6px;border-radius:3px;background:var(--border)}
  .dots i.f{background:var(--k)}
  .tok.them .dots i{height:4px}

  /* clue cards */
  .clues{display:flex;flex-direction:column;gap:clamp(5px,.9dvh,8px)}
  .cl{display:flex;gap:10px;align-items:center;border-radius:14px;padding:clamp(8px,1.4dvh,12px) 12px;background:var(--surface);border:1px solid var(--border);min-height:0}
  .cl small{font-size:9.5px;letter-spacing:1.8px;color:var(--muted);width:68px;flex:none;text-transform:uppercase}
  .cl span{font-size:13.5px;line-height:1.35;flex:1;min-width:0}
  .cl.open{border-color:color-mix(in srgb,var(--t) 45%,var(--border))}
  .cl.open small{color:var(--t)}
  .cl.new{animation:flip .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes flip{from{transform:rotateX(70deg);opacity:0}}
  .cl.shut{border-style:dashed;color:var(--muted)}
  .cl.shut span{font-size:12px;color:var(--muted)}
  .cl.shut svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
  .cl .free{font-size:9px;letter-spacing:1px;color:var(--green);border:1px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:6px;padding:1px 5px}

  .hint{margin-top:clamp(8px,1.4dvh,12px);display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:16px;padding:12px 14px;background:var(--t);color:#fff;cursor:pointer;font-family:var(--mono);text-align:left;
        box-shadow:0 8px 22px color-mix(in srgb,var(--t) 30%,transparent)}
  .hint b{font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:2px;flex:1}
  .hint small{font-size:10.5px;opacity:.9}
  .hint .ready{display:flex}
  .hint .ready .pfp{width:20px;height:20px;font-size:9px;margin-left:-5px;box-shadow:0 0 0 2px var(--t);opacity:.45}
  .hint .ready .pfp.ok{opacity:1}
  .hint.mine{background:color-mix(in srgb,var(--t) 16%,var(--surface));color:var(--t);box-shadow:none;border:1.5px solid var(--t)}
  .hint.mine .ready .pfp{box-shadow:0 0 0 2px var(--surface)}
  .hint[disabled]{background:var(--surface2);color:var(--muted);box-shadow:none;cursor:default}

  .log{display:flex;gap:6px;flex-wrap:wrap;margin-top:clamp(8px,1.4dvh,12px);min-height:22px;align-items:center}
  .log small{font-size:9.5px;letter-spacing:1.8px;color:var(--muted);margin-right:2px}
  .log span{font-size:11px;padding:3px 8px;border-radius:8px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
  .log span::before{content:"\2717 ";color:var(--accent);display:inline-block;text-decoration:none}
  .gap{flex:1;min-height:6px}

  /* the captain's proposal */
  .prop{border-radius:18px;padding:14px;background:var(--surface);border:1.5px solid var(--t);text-align:center;box-shadow:var(--lift)}
  .prop small{font-size:10.5px;color:var(--muted)}
  .prop h3{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.6dvh,36px);letter-spacing:1.5px;line-height:1;margin:6px 0 4px;color:var(--text)}
  .prop .votes{font-size:10.5px;color:var(--muted);margin-bottom:10px}
  .prop .votes b{color:var(--t)}
  .two{display:flex;gap:8px}
  .two .btn{flex:1}
  .go{background:var(--t);color:#fff;box-shadow:0 10px 26px color-mix(in srgb,var(--t) 30%,transparent)}
  .note{text-align:center;font-size:11.5px;color:var(--muted);line-height:1.5}
  .note b{color:var(--t);font-weight:500}

  /* captain: search */
  .search{position:relative}
  .search input{width:100%;border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:14px;padding:13px 14px 13px 40px;font-family:var(--mono);font-size:14px;outline:none}
  .search input:focus{border-color:var(--t)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
  .sugg{display:flex;flex-direction:column;gap:5px;margin:8px 0}
  .sugg button{text-align:left;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 12px;font-family:var(--mono);font-size:13px;cursor:pointer}
  .sugg button b{color:var(--t);font-weight:500}
  .sugg button.sel{border-color:var(--t);background:color-mix(in srgb,var(--t) 10%,var(--surface))}
  .capline{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:1.5px;color:var(--t);text-transform:uppercase;margin-bottom:8px}
  .capline i{width:7px;height:7px;border-radius:50%;background:var(--t)}

  .final{border-radius:14px;padding:10px 12px;text-align:center;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1.5px solid var(--accent);margin-bottom:8px}
  .final b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:2px;color:var(--accent);display:block;line-height:1.1}
  .final small{font-size:11px;color:var(--muted)}

  /* flash after a locked guess */
  .flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;text-align:center;pointer-events:none;animation:fl 1.6s ease-out both}
  .flash b{font-family:var(--display);font-weight:400;font-size:64px;letter-spacing:3px;color:#fff;line-height:1}
  .flash span{color:rgba(255,255,255,.9);font-size:13px;margin-top:6px}
  .flash.no{background:color-mix(in srgb,var(--accent) 92%,transparent)}
  .flash.yes{background:color-mix(in srgb,#12b86d 94%,transparent)}
  @keyframes fl{0%{opacity:0}10%,75%{opacity:1}100%{opacity:0}}
  @media (max-height:700px){.cl{padding:6px 10px}.cl span{font-size:12.5px}.hint{padding:9px 12px}.hint b{font-size:19px}.tokbar{margin:4px 0 8px}.log{margin-top:6px}.sugg{margin:6px 0}.sugg button{padding:8px 12px}.search input{padding:11px 14px 11px 40px}}

  /* reveal + final */
  .movie{text-align:center;margin:clamp(10px,2.6dvh,28px) 0 clamp(10px,2dvh,18px)}
  .movie small{font-size:10.5px;letter-spacing:2.5px;color:var(--muted)}
  .movie h1{font-family:var(--display);font-weight:400;font-size:clamp(42px,8dvh,64px);letter-spacing:2px;line-height:1;margin-top:6px}
  .movie p{font-size:12px;color:var(--muted);margin-top:6px}
  .vs{display:flex;gap:10px}
  .vs > div{flex:1;border-radius:18px;padding:14px 10px;text-align:center;background:var(--surface);border:1px solid var(--border);box-shadow:var(--lift)}
  .vs > div.win{border:1.5px solid var(--k);background:color-mix(in srgb,var(--k) 9%,var(--surface))}
  .vs small{font-size:10px;letter-spacing:2px;color:var(--k)}
  .vs b{display:block;font-family:var(--display);font-weight:400;font-size:46px;line-height:1;margin:4px 0;color:var(--k)}
  .vs span{font-size:10.5px;color:var(--muted)}
  .vs em{display:block;font-style:normal;font-size:10.5px;color:var(--text);margin-top:6px;line-height:1.4}
  .bottom{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .hist{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;margin-top:clamp(10px,2dvh,16px)}
  .hrow{display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);font-size:12px;flex:0 1 40px;min-height:30px}
  .hrow i{font-style:normal;font-family:var(--display);font-size:16px;color:var(--muted);width:24px}
  .hrow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow b{font-family:var(--display);font-weight:400;font-size:18px;width:34px;text-align:center}
  .hrow b.a{color:var(--ta)} .hrow b.b{color:var(--tb)}
  .champ{text-align:center;margin:clamp(8px,2.4dvh,26px) 0 clamp(8px,2dvh,18px)}
  .champ small{font-size:10.5px;letter-spacing:2.5px;color:var(--muted)}
  .champ h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,8dvh,64px);letter-spacing:2px;line-height:1;margin-top:4px;color:var(--ta)}

  /* waiting room teams (core waiting room gets team columns) */
  .wteams{display:flex;gap:10px;flex:1;min-height:0;margin-top:12px}
  .wcol{flex:1;border-radius:18px;padding:12px;background:var(--surface);border:1px solid color-mix(in srgb,var(--k) 40%,var(--border));display:flex;flex-direction:column;gap:6px;min-width:0}
  .wcol h4{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:2px;color:var(--k);display:flex;justify-content:space-between;align-items:center}
  .wcol h4 small{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px}
  .wp{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0;border-top:1px solid var(--border)}
  .wp .pfp{width:24px;height:24px;font-size:10px;flex:none}
  .wp span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  .wp span small{display:block;font-size:8.5px;letter-spacing:1.5px;color:var(--k)}
  .wp em{font-style:normal;font-size:8.5px;letter-spacing:1px;color:var(--k);border:1px solid color-mix(in srgb,var(--k) 40%,transparent);border-radius:5px;padding:1px 4px}
  .wp button{border:1px solid var(--border);background:none;color:var(--muted);border-radius:8px;width:26px;height:24px;cursor:pointer;font-size:12px}
  .wjoin{margin-top:auto;border:1.5px dashed color-mix(in srgb,var(--k) 50%,var(--border));background:none;color:var(--k);border-radius:12px;padding:9px;font-family:var(--mono);font-size:11px;cursor:pointer}
  .greenbtn{background:var(--green);color:#06140d;box-shadow:0 10px 26px color-mix(in srgb,var(--green) 25%,transparent)}

  /* the waiting room's seats become two team columns */
  .seats.cp{display:block;margin-top:clamp(8px,2dvh,16px)}
  .seats.cp .wteams{flex:none;margin-top:0}
  .seats.cp .wcol{min-height:clamp(90px,18dvh,220px)}
  .seats.cp .wp{padding:clamp(2px,.6dvh,5px) 0}
  .seats.cp .wcol{padding:10px;gap:clamp(2px,.6dvh,6px)}
  .seats.cp .wjoin{padding:7px}
  /* a full room must still fit: tighten the code block above the teams */
  #s-wait.cpw .w-code{margin-top:clamp(0px,1dvh,14px)}
  #s-wait.cpw .w-code .code{font-size:clamp(34px,7.5dvh,60px);line-height:1}
  #s-wait.cpw .w-code .links{margin-top:2px}
  #s-wait.cpw .status{margin-top:8px}
  #s-wait.cpw .summary{margin-top:4px}
  #s-wait.cpw .start{padding-top:10px}
  #s-wait.cpw .w-code{margin-top:0}
  @media (max-height:700px){.seats.cp .wp .pfp{width:20px;height:20px;font-size:9px}.seats.cp .wp{font-size:12px}.seats.cp .wcol h4{font-size:17px}.seats.cp .bal{margin-top:6px;padding:8px;font-size:15px}.seats.cp .wp button{height:20px}}
  .seats.cp .wp.off{opacity:.45}
  .seats.cp .bal{margin-top:10px;padding:11px;font-size:17px}
  .wjoin[hidden]{display:none}
  #leaveSheet p{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}
  .prop .mine{font-size:11px;color:var(--muted);padding:6px 0 2px}
  .prop .btn{margin-top:0}
  /* keyboard open while the captain searches: keep the search in view */
  #g-round.kb .clues,#g-round.kb .hint,#g-round.kb .log,#g-round.kb .final{display:none}
  .flash.mid{background:color-mix(in srgb,var(--surface2) 96%,transparent)}
  .flash.mid b{color:var(--text)} .flash.mid span{color:var(--muted)}
  .vs em s{text-decoration:none;color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="game">
  <!-- THE ROUND -->
  <section class="gs" id="g-round">
    <div class="bar">
      <button class="icon-btn" type="button" data-leave aria-label="Leave"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="l-mid"><b class="rno"></b><small id="teamTag"></small></div>
      <div class="clock" id="clock"></div>
    </div>
    <div class="tokbar" id="tokbar"></div>
    <div class="clues" id="clues"></div>
    <button class="hint" type="button" id="hintBtn"><b></b><small></small><span class="ready"></span></button>
    <div class="log" id="log"></div>
    <div class="gap"></div>
    <div class="final" id="finalTag" hidden><b>FINAL GUESS</b><small>Right +1 · wrong −1</small></div>
    <div id="capBox" hidden>
      <div class="capline"><i></i>Pick the movie, your team votes</div>
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Type a movie…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>
      <div class="sugg" id="sugg"></div>
      <button class="btn go" type="button" id="propBtn" disabled>PROPOSE</button>
    </div>
    <div id="act"></div>
  </section>

  <!-- REVEAL -->
  <section class="gs" id="g-rev">
    <div class="bar">
      <button class="icon-btn" type="button" data-leave aria-label="Leave"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="l-mid"><b class="rno"></b><small id="revSub" style="color:var(--muted)"></small></div>
      <span style="width:40px"></span>
    </div>
    <div class="movie"><small>THE MOVIE WAS</small><h1 id="revMovie"></h1><p id="revInfo"></p></div>
    <div class="vs" id="revVs"></div>
    <div class="gap"></div>
    <div class="bottom" id="revBottom"></div>
  </section>

  <!-- GAME OVER -->
  <section class="gs" id="g-end">
    <div class="bar">
      <button class="icon-btn" type="button" data-leave aria-label="Leave"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="l-mid"><b>GAME OVER</b><small id="endSub" style="color:var(--muted)"></small></div>
      <span style="width:40px"></span>
    </div>
    <div class="champ" id="champ"></div>
    <div class="vs" id="endVs"></div>
    <div class="hist" id="hist"></div>
    <div class="bottom" id="endBottom"></div>
  </section>
</div>

<div class="scrim" id="gScrim"></div>
<section class="sheet" id="leaveSheet" aria-label="Leave"><div class="grab"></div><h3>LEAVE THE GAME?</h3>
  <p>Your team keeps playing without you. You can join again between rounds with the room code.</p>
  <div class="two"><button class="btn outline" type="button" data-stay>STAY</button><button class="btn" type="button" id="leaveYes">LEAVE</button></div></section>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<script src="data/cluepool-names.js"></script>
<script src="core/core.js?v=0.2.1"></script>
<script src="core/howto.js?v=0.2.0"></script>
<script src="core/core-ui.js?v=0.2.3"></script>
<script>
(() => {
  'use strict';
  const C = Cinefied, UI = CinefiedUI, esc = C.esc;
  const $ = id => document.getElementById(id);
  const game = $('game');
  const NAMES = window.CluePoolNames;
  const TOKENS = 7, ROUND_MS = 120000;   // same as functions/cluepool.js

  let V = null, shown = null, skew = 0, pick = null, lastDeal = null, lastLog = 0, lastHints = 0, lastPhase = null, onlineSig = '';
  const busy = new Set(), asked = new Set(), flashed = new Set();
  const now = () => Date.now() + skew;

  function fitViewport() {
    const h = window.visualViewport ? window.visualViewport.height : innerHeight;
    document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
    if (window.visualViewport) scrollTo(0, 0);
  }
  if (window.visualViewport) visualViewport.addEventListener('resize', fitViewport);
  addEventListener('resize', fitViewport);

  // ── helpers over the room ──
  const st = () => (V && V.room.state) || {};
  const ph = () => (V ? V.room.phase : null);
  const P = u => V.room.players[u];
  const nameOf = u => (P(u) && P(u).name) || (st().names || {})[u] || 'Player';
  const isMe = u => V && u === V.me;
  const colorOf = u => (isMe(u) ? 'linear-gradient(135deg,var(--accent),var(--accent2))' : UI.avColor(u));
  const av = (u, cls) => `<span class="pfp${cls ? ' ' + cls : ''}" style="--pc:${colorOf(u)}">${UI.initial(nameOf(u))}</span>`;
  const myTeam = () => (st().team || {})[V.me] || null;
  const other = t => (t === 'A' ? 'B' : 'A');
  const card = () => (V.private && V.private[st().deal]) || null;
  const onlineOf = t => Object.keys(st().team || {}).filter(u => st().team[u] === t && P(u) && P(u).online !== false);
  const captainOf = t => String(st().ord || '').split(',').find(u => (st().team || {})[u] === t && P(u) && P(u).online !== false) || null;
  const kOf = t => (t === 'A' ? 'var(--ta)' : 'var(--tb)');
  function setHTML(el, html) { if (el.dataset.h !== html) { el.dataset.h = html; el.innerHTML = html; } }
  function show(id) {
    if (shown === id) return;
    shown = id;
    document.querySelectorAll('#game .gs').forEach(s => { s.classList.toggle('on', s.id === id); s.classList.toggle('in', s.id === id); });
  }
  const MSG = { not_captain: 'Only the captain proposes', bad_movie: 'Pick a movie from the list', tried: 'Your team already tried that one', no_hint: 'No hint available', teams: 'Each team needs at least one player' };
  async function ask(action, extra) {
    const key = action + (extra && extra.uid ? extra.uid : '');
    if (busy.has(key)) return {};
    busy.add(key);
    const r = await C.referee(action, extra);
    busy.delete(key);
    if (!r.ok && MSG[r.error]) UI.say(MSG[r.error]);
    else if (!r.ok && !['phase', 'noop', 'abort', 'stale'].includes(r.error)) UI.say(C.message({ code: r.error }));
    return r;
  }
  function flash(kind, big, small) {
    const s = document.querySelector('#game .gs.on'); if (!s) return;
    const d = document.createElement('div'); d.className = 'flash ' + kind; d.innerHTML = `<b>${esc(big)}</b><span>${esc(small || '')}</span>`;
    s.appendChild(d); setTimeout(() => d.remove(), 1700);
  }

  // ══ the round ════════════════════════════════════════════════

      wait: (v, els) => { V0 = v; drawTeams(v, els); },
    },
    gameNames: { pictionary: 'Pictionary', imposter: 'Imposter', tictactoe: 'Tic Tac Toe', tierd: "Tier'd", likely: "Who's More Likely", wavelength: 'Wavelength', blindspot: 'Blindspot', cluepool: 'Clue Pool' },
    onStart: v => { V = v; shown = null; lastPhase = null; onlineSig = ''; game.classList.add('on'); fitViewport(); render(); },
    onUpdate: v => { V = v; render(); },
    onLobby: () => { V = null; shown = null; closeLeave(); game.classList.remove('on'); },
  });
  firebase.database().ref('.info/serverTimeOffset').on('value', s => { skew = Number(s.val()) || 0; });
})();
</script>
</body>
